<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulso CRM</title>
  <meta name="description" content="CRM simples para acompanhar contatos, negócios e tarefas em um só lugar.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c6b58'/%3E%3Cpath d='M6 16h5l3-8 4 16 3-8h5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading" class="splash">Carregando…</div>
  <div id="auth" class="auth" hidden></div>

  <div class="app" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/painel" aria-label="Pulso CRM, ir para o painel">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
        </span>
        <span class="brand-name">Pulso <em>CRM</em></span>
      </a>

      <nav class="nav" id="nav" aria-label="Principal">
        <a href="#/painel" data-route="painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Painel</span>
        </a>
        <a href="#/pipeline" data-route="pipeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg>
          <span>Funil</span>
        </a>
        <a href="#/contatos" data-route="contatos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.9c1.6.8 2.7 2.4 3 5.1"/></svg>
          <span>Contatos</span>
        </a>
        <a href="#/tarefas" data-route="tarefas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
          <span>Tarefas</span>
          <i class="badge" id="task-badge" hidden></i>
        </a>
        <a href="#/config" data-route="config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Dados</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <span id="account-email" class="account-email"></span>
        <button type="button" class="link" data-action="sign-out">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title"></h1>
          <p id="page-sub"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
